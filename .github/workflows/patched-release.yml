# Build a patched QEMU release for an upstream tag:
#   1. create branch patched/<tag> from <tag> and apply PATCHES (patchew mbox)
#   2. tag it <tag>+patched and push branch + tag
#   3. build linux (amd64/arm64) and windows (amd64/arm64)
#   4. publish a GitHub release for <tag>+patched
#
# Runs either manually (workflow_dispatch) or from sync-upstream.yml
# (workflow_call) when a new upstream tag shows up.

name: Patched release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag (e.g. v11.1.2)'
        required: true
        type: string
      force:
        description: 'Re-create patched branch/tag even if they already exist'
        required: false
        type: boolean
        default: false
      targets:
        description: 'QEMU --target-list'
        required: false
        type: string
        default: 'x86_64-softmmu,aarch64-softmmu'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      force:
        required: false
        type: boolean
        default: false
      targets:
        required: false
        type: string
        default: 'x86_64-softmmu,aarch64-softmmu'

# All writes use a short-lived GitHub App token (QEMU_BOT_*), not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: patched-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  TARGETS: ${{ inputs.targets }}
  # patchew mbox URLs, applied in order with "git am -3".  Patches already
  # present in the tag (e.g. backported to stable) are skipped by git am.
  PATCHES: |
    https://patchew.org/QEMU/20260421205749.55060-1-mohamed@unpredictable.fr/mbox

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      patched_tag: ${{ steps.vars.outputs.patched_tag }}
      dist_prefix: ${{ steps.vars.outputs.dist_prefix }}
    steps:
      - name: Compute names
        id: vars
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Invalid tag '$TAG'"
            exit 1
          fi
          echo "patched_tag=${TAG}+patched" >> "$GITHUB_OUTPUT"
          echo "branch=patched/${TAG}" >> "$GITHUB_OUTPUT"
          # '+' is avoided in asset file names
          echo "dist_prefix=qemu-${TAG}-patched" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.QEMU_BOT_CLIENT_ID }}
          private-key: ${{ secrets.QEMU_BOT_PRIVATE_KEY }}
          permission-contents: write
          # The pushed history contains upstream's .github/workflows.
          permission-workflows: write

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          # Full history: "git am -3" needs the pre-image blobs to detect
          # patches that were already backported into the tag.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply patches, tag and push
        env:
          PTAG: ${{ steps.vars.outputs.patched_tag }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          bot_id=$(gh api "/users/$BOT" --jq .id)
          git config user.name "$BOT"
          git config user.email "${bot_id}+${BOT}@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$PTAG" >/dev/null && [ "$FORCE" != true ]; then
            echo "::notice::$PTAG already exists; reusing it (set force to re-create)."
            git fetch --no-tags origin "+refs/tags/$PTAG:refs/tags/$PTAG"
          else
            mkdir -p "$RUNNER_TEMP/patches"
            i=0
            while read -r url; do
              [ -n "$url" ] || continue
              i=$((i + 1))
              f="$RUNNER_TEMP/patches/$(printf '%02d' "$i").mbox"
              curl -fsSL --retry 3 -o "$f" "$url"
              echo "== $url"
              grep -E '^Subject:' "$f" || true
            done <<< "$PATCHES"

            git am -3 "$RUNNER_TEMP"/patches/*.mbox

            {
              echo "QEMU $TAG with additional patches"
              echo
              git log --reverse --format='* %s' "refs/tags/$TAG..HEAD"
            } > "$RUNNER_TEMP/tagmsg"
            git tag -f -a "$PTAG" -F "$RUNNER_TEMP/tagmsg"

            git push --force origin "HEAD:refs/heads/$BRANCH" "+refs/tags/$PTAG:refs/tags/$PTAG"
          fi

          {
            echo "QEMU \`$TAG\` with the following additional patches"
            echo "(branch \`$BRANCH\`):"
            echo
            git log --reverse --format='* %s (%an)' "refs/tags/$TAG..refs/tags/$PTAG"
            echo
            echo "Patch sources:"
            echo
            sed -n 's/^ *\(https:.*\)/* \1/p' <<< "$PATCHES"
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      DIST: ${{ needs.prepare.outputs.dist_prefix }}-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.patched_tag }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev \
            zlib1g-dev libzstd-dev libcap-ng-dev libattr1-dev \
            libseccomp-dev libaio-dev liburing-dev libnuma-dev

      - name: Build
        run: |
          set -euo pipefail
          mkdir build && cd build
          ../configure --prefix=/opt/qemu --target-list="$TARGETS" \
            --enable-kvm --enable-slirp --disable-docs --disable-werror
          make -j"$(nproc)"
          make install DESTDIR="$PWD/stage"
          mkdir -p ../dist
          tar -C stage/opt -cJf "../dist/$DIST.tar.xz" --transform "s,^qemu,$DIST," qemu

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST }}
          path: dist/*

  windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            msystem: UCRT64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
    runs-on: ${{ matrix.runner }}
    env:
      DIST: ${{ needs.prepare.outputs.dist_prefix }}-windows-${{ matrix.arch }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.patched_tag }}
          fetch-depth: 1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            bison diffutils flex git grep make sed zip
          pacboy: >-
            cc:p ninja:p pkgconf:p python:p python-setuptools:p python-wheel:p
            glib2:p pixman:p libslirp:p zstd:p SDL2:p

      - name: Build
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          mkdir build && cd build
          ../configure --target-list="$TARGETS" \
            --enable-whpx --enable-slirp --disable-docs --disable-werror
          make -j"$(nproc)"
          make install DESTDIR="$PWD/stage"

      - name: Package
        run: |
          set -euo pipefail
          exe=$(find build/stage -name 'qemu-system-*.exe' | head -n1)
          dir=$(dirname "$exe")

          # Bundle the MSYS2 DLLs the binaries depend on (recursively).
          od=$(command -v llvm-objdump || command -v objdump)
          queue=("$dir"/*.exe)
          seen=' '
          while [ ${#queue[@]} -gt 0 ]; do
            f=${queue[0]}
            queue=("${queue[@]:1}")
            for dll in $("$od" -p "$f" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr -d '\r'); do
              case "$seen" in *" $dll "*) continue ;; esac
              seen="$seen$dll "
              src="$MINGW_PREFIX/bin/$dll"
              [ -f "$src" ] || continue   # Windows system DLL
              cp "$src" "$dir/"
              queue+=("$src")
            done
          done

          mkdir -p dist
          out="$PWD/dist/$DIST.zip"
          (cd "$dir" && zip -qr9 "$out" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST }}
          path: dist/*

  release:
    needs: [prepare, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.QEMU_BOT_CLIENT_ID }}
          private-key: ${{ secrets.QEMU_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PTAG: ${{ needs.prepare.outputs.patched_tag }}
        run: |
          set -euo pipefail
          cd dist
          mv release-notes.md ../
          sha256sum -- * > SHA256SUMS
          if gh release view "$PTAG" >/dev/null 2>&1; then
            gh release edit "$PTAG" --notes-file ../release-notes.md
            gh release upload "$PTAG" --clobber -- *
          else
            gh release create "$PTAG" --verify-tag --title "QEMU $PTAG" \
              --notes-file ../release-notes.md -- *
          fi
